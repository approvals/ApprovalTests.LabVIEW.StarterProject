name: Run_Example_Tests

on:
  push:
  workflow_dispatch:
  # Lets other repos (e.g. ApprovalTests.LabVIEW's release pipeline) call this workflow directly
  # and wait on it as a normal job dependency - no cross-repo token needed since the called job
  # runs inside the caller's own workflow run.
  workflow_call:
    inputs:
      package_artifact_name:
        description: 'Name of a package artifact already uploaded in this run to install before testing'
        type: string
        required: false
      starter_ref:
        description: 'Ref of this repo to check out. Defaults to the ref that triggered the run, which is wrong when called from another repo, so callers should always set this explicitly.'
        type: string
        required: false
env:
  PACKAGE_VERSION: 3.0.0
permissions:
  checks: write
  pull-requests: write # only required if `comment: true` was enabled

jobs:
  PylaviChecks:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Pinned explicitly: when called via workflow_call from another repo, the default
          # checkout target is the CALLER's repo/ref, not this one.
          repository: approvals/ApprovalTests.LabVIEW.StarterProject
          ref: ${{ inputs.starter_ref || github.ref }}
      - name: Pylavi
        run: |
          pip install pylavi
          # needs to all be in 2020
          vi_validate \
          --path Source \
          --path Tests \
          --gt 20 --lt 21 \
          --no-code \
          --breakpoints \
          --no-suspend-on-run

  # Runs on a Windows GitHub-hosted runner against NI's official LabVIEW Windows container image.
  # Windows containers can't be used as a job-level `container:` on GitHub-hosted runners the way
  # the Linux job above does, so each `docker run` below is its own fresh, ephemeral container -
  # nothing installed or started in one step is visible to the next. That's why the whole
  # package-install + test-run sequence lives in a single docker run invoking one script
  # (scripts/windows/run-lunit-tests.ps1), mirroring the pattern NI uses for its own
  # cicd-examples (see masscompile-windows-container.yml / run-vi-analyzer-windows-container.yml
  # in https://github.com/ni/labview-for-containers).
  #
  # Per https://github.com/ni/labview-for-containers/blob/main/docs/windows-prebuilt.md and its
  # own Dockerfile-windows, this image ships LabVIEW, LabVIEWCLI, and NI Package Manager (nipkg,
  # NI's own .nipkg-feed tool) preinstalled - but NOT the classic VIPM CLI (vipm.exe) that
  # understands the .vip/.vipc files this project's whole dependency stack (LUnit, Caraya, g-cli,
  # JSONtext, ApprovalTests itself) is distributed as. So run-lunit-tests.ps1 installs VIPM CLI
  # itself first (same idea as the Linux job's curl'd .deb), runs it in Community Edition mode
  # (VIPM_COMMUNITY_EDITION - avoids needing `vipm activate` with a Pro serial), and the container
  # is given the *host runner's* git.exe via a bind mount (see the -v ...Git... below) because
  # VIPM Community Edition shells out to git to check a package repository's visibility and the
  # image has no git of its own. No Xvfb/display setup is needed here (Windows-only concern).
  LUnit:
    needs: PylaviChecks
    runs-on: windows-latest

    env:
      LABVIEW_IMAGE: 2026q3-windows
      LABVIEW_VERSION_YEAR: 2026
      LABVIEW_BITNESS: 64
      VIPM_NONINTERACTIVE: 1
      VIPM_ASSUME_YES: 1
      VIPM_DEBUG: 0
      # Forces VIPM to run as Community Edition rather than requiring `vipm activate` with a Pro
      # serial - same purpose as the Linux job's VIPM_COMMUNITY_EDITION. Missing on the Windows
      # job's first CI run caused `vipm install` to fail loading Settings.ini (exit code 8) since
      # a genuinely fresh VIPM CLI install has no default settings file until activation/edition
      # is resolved one way or the other. See https://docs.vipm.io/preview/cli/environment-variables/
      VIPM_COMMUNITY_EDITION: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Pinned explicitly: when called via workflow_call from another repo, the default
          # checkout target is the CALLER's repo/ref, not this one.
          repository: approvals/ApprovalTests.LabVIEW.StarterProject
          ref: ${{ inputs.starter_ref || github.ref }}

      - name: Pull LabVIEW container image
        run: docker pull nationalinstruments/labview:${{ env.LABVIEW_IMAGE }}

      - name: Download Approval Tests package
        # Same workflow run as the caller (workflow_call jobs execute inside the caller's run),
        # so no cross-repo repository/run-id/token is needed - just the artifact name.
        if: inputs.package_artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package_artifact_name }}
          path: downloaded-package

      - name: Run LUnit tests (LabVIEW Windows container)
        shell: pwsh
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:C:\workspace" `
            -v "C:\Program Files\Git:C:\Git" `
            -e VIPM_NONINTERACTIVE `
            -e VIPM_ASSUME_YES `
            -e VIPM_DEBUG `
            -e VIPM_COMMUNITY_EDITION `
            nationalinstruments/labview:${{ env.LABVIEW_IMAGE }} `
            powershell -File "C:\workspace\scripts\windows\run-lunit-tests.ps1" `
              -LabviewYear ${{ env.LABVIEW_VERSION_YEAR }} `
              -LabviewBitness ${{ env.LABVIEW_BITNESS }} `
              -VipcPath "C:\workspace\Approvals.StarterProject.Lunit.vipc" `
              -ProjectPath "C:\workspace\Approvals.StarterProject.Lunit.lvproj" `
              -ReportPath "C:\workspace\reports\Lunit.UnitTestReport.xml" `
              -PackageDir "C:\workspace\downloaded-package"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'reports/*UnitTestReport.xml'
          include_passed: true

      - name: Grab Artifacts
        if: success() || failure() # always run even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: lunit-test-reports
          path: |
            reports/*UnitTestReport.xml
            **/*.received.*

# Get LUnit running first
  Caraya:
    if: false
    runs-on: windows-latest

    env:
      LABVIEW_IMAGE: 2026q3-windows
      LABVIEW_VERSION_YEAR: 2026
      LABVIEW_BITNESS: 64
      VIPM_NONINTERACTIVE: 1
      VIPM_ASSUME_YES: 1
      VIPM_DEBUG: 0
      # Forces VIPM to run as Community Edition rather than requiring `vipm activate` with a Pro
      # serial - same purpose as the Linux job's VIPM_COMMUNITY_EDITION. Missing on the Windows
      # job's first CI run caused `vipm install` to fail loading Settings.ini (exit code 8) since
      # a genuinely fresh VIPM CLI install has no default settings file until activation/edition
      # is resolved one way or the other. See https://docs.vipm.io/preview/cli/environment-variables/
      VIPM_COMMUNITY_EDITION: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Pinned explicitly: when called via workflow_call from another repo, the default
          # checkout target is the CALLER's repo/ref, not this one.
          repository: approvals/ApprovalTests.LabVIEW.StarterProject
          ref: ${{ inputs.starter_ref || github.ref }}
          submodules: recursive

      - name: Pull LabVIEW container image
        run: docker pull nationalinstruments/labview:${{ env.LABVIEW_IMAGE }}

      - name: Download Approval Tests package
        if: inputs.package_artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package_artifact_name }}
          path: downloaded-package

      - name: Run Caraya tests (LabVIEW Windows container)
        shell: pwsh
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:C:\workspace" `
            -v "C:\Program Files\Git:C:\Git" `
            -e VIPM_NONINTERACTIVE `
            -e VIPM_ASSUME_YES `
            -e VIPM_DEBUG `
            -e VIPM_COMMUNITY_EDITION `
            nationalinstruments/labview:${{ env.LABVIEW_IMAGE }} `
            powershell -File "C:\workspace\scripts\windows\run-caraya-tests.ps1" `
              -LabviewYear ${{ env.LABVIEW_VERSION_YEAR }} `
              -LabviewBitness ${{ env.LABVIEW_BITNESS }} `
              -VipcPath "C:\workspace\Approvals.StarterProject.Caraya.vipc" `
              -TestPath "C:\workspace\Caraya.Tests" `
              -ReportPath "C:\workspace\reports\Caraya.UnitTestReport.xml" `
              -PackageDir "C:\workspace\downloaded-package"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'reports/*UnitTestReport.xml'
          include_passed: true

      - name: Grab Artifacts
        if: success() || failure() # always run even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: caraya-test-reports
          path: |
            reports/*UnitTestReport.xml
            **/*.received.*
